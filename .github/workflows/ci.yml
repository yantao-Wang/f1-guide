# 质量门禁：push/PR 触发全套检查（报告 §8.2）
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: 静态分析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  test:
    name: 单元测试 + 覆盖率
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: 运行测试并生成覆盖率
        run: go test -coverprofile=cover.out ./...
      - name: 校验覆盖率 ≥70%
        run: |
          total=$(go tool cover -func=cover.out | grep '^total:' | awk '{gsub("%","",$3); print $3}')
          echo "总覆盖率: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 70) }' || { echo "覆盖率低于 70%"; exit 1; }

  vuln:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: 编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: go build
        run: go build ./...
