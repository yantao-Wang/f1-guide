# 质量门禁：push/PR 触发全套检查（报告 §8.2）
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: 静态分析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  test:
    name: 单元测试 + 契约测试 + 覆盖率
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: 运行全部测试（含契约测试）
        run: go test ./...
      - name: 运行测试并生成覆盖率
        # 口径：可测试代码（internal + pkg）；cmd/api 的 main 函数不参与单测
        run: go test -coverprofile=cover.out ./internal/... ./pkg/...
      - name: 校验覆盖率 ≥70%
        run: |
          total=$(go tool cover -func=cover.out | grep '^total:' | awk '{gsub("%","",$3); print $3}')
          echo "总覆盖率: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 70) }' || { echo "覆盖率低于 70%"; exit 1; }

  integration:
    name: 集成测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: f1guide
          POSTGRES_PASSWORD: f1guide
          POSTGRES_DB: f1guide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U f1guide -d f1guide"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: 集成测试（真实 PostgreSQL）
        env:
          F1GUIDE_TEST_DATABASE_URL: postgres://f1guide:f1guide@localhost:5432/f1guide?sslmode=disable
        run: go test -tags=integration ./tests/integration/...

  vuln:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: 编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: go build
        run: go build ./...
