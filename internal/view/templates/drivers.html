{{define "drivers"}}{{template "layout" .}}{{end}}

{{define "content"}}
<h1 class="page-title">车手故事</h1>
<p class="page-lead">不讲黑话，不贴标签。从零开始，认识每一位车手。</p>

<div class="grid">
  {{range .Data.Drivers}}
  <a class="card driver-card{{if .ImageURL}} has-photo{{end}}" href="/stories/drivers/{{.Slug}}" style="--team-color: {{.Team.Color}}{{if .ImageURL}}; background-image: url('{{.ImageURL}}'){{end}}">
    {{if .Number}}
    <div class="driver-card-top">
      <span class="driver-number">{{.Number}}</span>
    </div>
    {{end}}
    <div class="driver-card-body">
      <h3 class="driver-name">{{.Name}}</h3>
      <p class="driver-team">{{.Team.Name}}</p>
      <p class="driver-tagline">{{.Tagline}}</p>
    </div>
  </a>
  {{end}}
</div>
{{end}}
