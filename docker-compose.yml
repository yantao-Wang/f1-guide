# 本地开发环境：PostgreSQL
# 生产部署架构见《可行性方案》§6（云服务器 + Nginx + 应用容器 + PostgreSQL）
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: f1guide
      POSTGRES_PASSWORD: f1guide
      POSTGRES_DB: f1guide
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1guide -d f1guide"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
